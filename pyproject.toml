[project]
name = "ai-npc-sentinel"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.25.20",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "langgraph-checkpoint>=4.1.1",
    "llama-index-core>=0.14.22",
    "llama-index-embeddings-dashscope>=0.5.0",
    "llama-index-vector-stores-chroma==0.5.5",
    "logger>=1.4",
    "loguru>=0.7.3",
    "mcp>=1.27.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
]

[tool.uv.workspace]
members = [
    "ai-npc-sentinel",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
